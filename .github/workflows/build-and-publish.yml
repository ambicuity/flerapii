name: build-and-publish

on:
  release:
    # `published` fires for both direct publishes and draft->publish flows;
    # `created` misses the common "save as draft, then publish" pattern.
    types: [published]
  workflow_dispatch: # 允许手动触发
    inputs:
      tag:
        description: "Release tag or commit hash to build. Leave empty to auto-detect latest."
        required: false
        default: ""
      review_chrome:
        description: "Submit Chrome build for review"
        required: false
        type: boolean
        default: true
      review_edge:
        description: "Submit Edge build for review"
        required: false
        type: boolean
        default: true

permissions:
  contents: write # 上传构建产物到 Release 需要写权限

# Never run two store submissions at once (a release + a manual dispatch, or two
# rapid releases) — they would race on the same version upload.
concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 先 checkout 完整仓库，后面要用 git 命令找 tag
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 决定要 checkout 的 ref（tag 或 commit）
      - name: Determine ref (tag or commit)
        id: get_ref
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          # 优先级：workflow 输入 tag/ref > release tag > 自动找最新 tag
          REF="$INPUT_TAG"

          if [ -z "$REF" ]; then
            REF="$RELEASE_TAG"
          fi

          if [ "$REF" = "latest" ]; then
            # 特殊值 latest → 使用默认分支最新 commit
            REF=$(git rev-parse origin/main)
            echo "ℹ️ Using latest commit from main: $REF"
          elif [ -z "$REF" ]; then
            # 如果没有提供任何输入，就找最新语义化版本的 tag
            REF=$(git tag --sort=-v:refname | head -n 1)
            if [ -n "$REF" ]; then
              echo "⚠️ No ref provided. Using latest tag: $REF"
            else
              echo "❌ No tag found in repo and no input ref. Skipping build."
              echo "ref=" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "ℹ️ Using provided ref (tag or commit): $REF"
          fi

          # 输出 ref 给后续步骤使用
          echo "ref=$REF" >> $GITHUB_OUTPUT

      # 3️⃣ Checkout 到指定的 ref（tag 或 commit hash）
      - name: Checkout specific ref
        if: ${{ steps.get_ref.outputs.ref != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.get_ref.outputs.ref }}
          fetch-depth: 0 # 确保获取完整历史，以便 tag、commit 都能找到

      # 安装 pnpm
      - uses: pnpm/action-setup@v4
        if: ${{ steps.get_ref.outputs.ref != '' }}
        with:
          version: 10
          run_install: false

      # 设置 Node.js 环境 + pnpm 缓存
      - uses: actions/setup-node@v6
        if: ${{ steps.get_ref.outputs.ref != '' }}
        with:
          node-version: 20
          cache: "pnpm"

      # 安装依赖（使用 lockfile 保证与 CI 校验的依赖树一致）
      - name: Install dependencies
        if: ${{ steps.get_ref.outputs.ref != '' }}
        run: pnpm install --frozen-lockfile

      # Guard: the built manifest version comes from package.json. On a release,
      # fail fast if the tag and package.json version disagree — otherwise the
      # store rejects the upload as a duplicate version (and, historically, that
      # failure was silently swallowed).
      - name: Verify release tag matches package.json version
        if: ${{ github.event_name == 'release' && steps.get_ref.outputs.ref != '' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "package.json=$PKG_VERSION  release tag=$RELEASE_TAG (normalized=$RELEASE_VERSION)"
          if [ "$PKG_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Release tag ($RELEASE_VERSION) does not match package.json version ($PKG_VERSION). Bump package.json before tagging."
            exit 1
          fi

      # 编译并打包扩展（先清理 .output，避免历史 zip 干扰后续按版本号定位产物）
      - name: Package the extension
        if: ${{ steps.get_ref.outputs.ref != '' }}
        run: |
          rm -rf .output
          pnpm zip:all
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "CHROME_ZIP=.output/${NAME}-${VERSION}-chrome.zip"
            echo "FIREFOX_ZIP=.output/${NAME}-${VERSION}-firefox.zip"
            echo "SOURCES_ZIP=.output/${NAME}-${VERSION}-sources.zip"
          } >> "$GITHUB_ENV"

      # 上传 Release Artifact（非关键步骤，失败不阻断发布）
      - name: Upload Release Artifact
        if: ${{ github.event_name == 'release' && steps.get_ref.outputs.ref != '' }}
        continue-on-error: true
        run: |
          echo "Uploading .output/*.zip to release ${{ github.event.release.tag_name }}"
          gh release upload "${{ github.event.release.tag_name }}" .output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 提交到 Chrome Web Store —— 关键路径，失败必须让整个 job 失败（不再吞掉错误）
      - name: Publish to Chrome Web Store
        if: ${{ steps.get_ref.outputs.ref != '' }}
        # Prefer the service-account key (CHROME_SERVICE_ACCOUNT_JSON); fall back
        # to the OAuth refresh-token flow of `wxt submit` when it is not set.
        run: |
          echo "Chrome review: $([ "$CHROME_SKIP_SUBMIT_REVIEW" = "true" ] && echo skipped || echo submitted)"
          if [ -n "$CHROME_SERVICE_ACCOUNT_JSON" ]; then
            node scripts/publish-chrome-webstore.mjs "$CHROME_ZIP"
          else
            pnpm wxt submit --chrome-zip "$CHROME_ZIP"
          fi
        env:
          CHROME_SKIP_SUBMIT_REVIEW: ${{ github.event.inputs.review_chrome == 'false' }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      # 提交到 Firefox / Edge —— 可选路径，凭据缺失或失败不阻断 Chrome 发布结果
      - name: Publish to Firefox and Edge
        if: ${{ steps.get_ref.outputs.ref != '' }}
        continue-on-error: true
        run: |
          echo "Edge review: $([ "$EDGE_SKIP_SUBMIT_REVIEW" = "true" ] && echo skipped || echo submitted)"
          pnpm wxt submit \
            --firefox-zip "$FIREFOX_ZIP" --firefox-sources-zip "$SOURCES_ZIP" \
            --edge-zip "$CHROME_ZIP"
        env:
          EDGE_SKIP_SUBMIT_REVIEW: ${{ github.event.inputs.review_edge == 'false' }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
